version: "3.8"
services:
  backend:
    build: .
    container_name: pendana_backend
    restart: always
    ports:
      - "8000:8000"   # Expose backend on localhost:8000
    volumes:
      - .:/app
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: pendana_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pendana
      MYSQL_USER: pendana_user
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
